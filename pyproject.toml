[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aharrsim"
version = "2.5.0"
description = "Transient wellbore-reservoir-plant simulator for geothermal wells: coaxial closed loops, production and injection wells, fracture and aquifer elements, plants (water/steam, IAPWS-95)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "CoolProp>=6.6", "pyyaml>=6.0", "matplotlib>=3.7"]

[project.scripts]
aharrsim = "aharrsim.cli:main"

[tool.setuptools]
packages = ["aharrsim"]
